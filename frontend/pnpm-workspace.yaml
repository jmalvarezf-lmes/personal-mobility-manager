allowBuilds:
  # Transitive deps of swagger-ui-react -> swagger-client -> @swagger-api/apidom-*,
  # used only for multi-format (YAML/JSON) $ref resolution when Swagger UI is
  # given a spec `url`. This app always passes a pre-fetched, mutated spec
  # object via the `spec` prop (see ApiDocsPage.tsx), so that code path is
  # never exercised — deny running their install/build scripts.
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  tree-sitter: false
  tree-sitter-json: false
onlyBuiltDependencies:
  - esbuild
overrides:
  # ReDoS fix (GHSA advisory), pulled in transitively via
  # swagger-ui-react -> swagger-client -> @swagger-api/apidom-reference -> minimatch.
  brace-expansion: ^5.0.7
  # @vitest/coverage-v8 pulls in glob@10.5.0 -> minimatch@9.0.9, which expects
  # brace-expansion's v2 CJS export shape. The global v5 override above (needed
  # for the swagger-ui-react ReDoS fix) breaks that chain at runtime with
  # "brace_expansion_1.default is not a function". Scope minimatch@9 in this
  # one chain back to the brace-expansion major it was built against.
  'minimatch@9>brace-expansion': ^2.0.1
  # Path traversal fix (GHSA-r28c-9q8g-f849), pulled in transitively via vite's
  # bundled postcss dependency.
  postcss: ^8.5.18
