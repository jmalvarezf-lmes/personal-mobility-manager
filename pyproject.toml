[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-manager"
version = "0.1.0"
description = "Personal mobility manager — multi-vendor, multi-city"
requires-python = ">=3.14"
dependencies = [
    "pytoyoda",
    "pydantic>=2.0",
    "email-validator",
    "python-dotenv>=1.2.2",
    "click",
    "httpx",
    "fastapi>=0.109.1",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pyproj",
    "apscheduler",
    "shapely",
    "pyshp",
    "jinja2",
    "cryptography>=48.0.1",
    "slowapi",
    "alembic",
    "authlib==1.7.2",
    "PyJWT==2.13.0",
    "itsdangerous==2.2.0",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "icalendar",
    # Transitive deps pinned to a security floor (not imported directly):
    # starlette (fastapi), mako (alembic), h11 (httpcore/uvicorn),
    # zipp (importlib_metadata), anyio (httpx/starlette), idna (anyio/httpx).
    "starlette>=0.49.1",
    "mako>=1.3.12",
    "h11>=0.16.0",
    "zipp>=3.19.1",
    "anyio>=4.4.0",
    "idna>=3.15",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[project.scripts]
mobility-manager = "mobility_manager.presentation.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mobility_manager.application" = ["templates/**/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shapefile.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
